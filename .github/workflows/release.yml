# Builds the Medify APK for a release tag (v1.0.0) and publishes it as a GitHub release.
#
# The APK is signed with the key in these repository secrets (Settings → Secrets and variables → Actions):
#   MUSIKE_KEYSTORE_BASE64    the .jks file, base64-encoded
#   MUSIKE_KEYSTORE_PASSWORD  MUSIKE_KEY_ALIAS  MUSIKE_KEY_PASSWORD
# Always the same key: Android only installs an update signed like the version already on the phone.
# Without them the APK is signed with the runner's throwaway debug key: it installs, but later releases won't update it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::MUSIKE_KEYSTORE_BASE64 is not set: the APK is signed with a debug key, so future releases won't install over it."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musike-release.jks"
          echo "MUSIKE_KEYSTORE=$RUNNER_TEMP/musike-release.jks" >> "$GITHUB_ENV"
      # The native app needs no JS dependencies (the runner's Node is enough): the script only runs Gradle and copies the APK.
      - run: node mobile/scripts/build-apk.mjs
        env:
          MUSIKE_KEYSTORE_PASSWORD: ${{ secrets.MUSIKE_KEYSTORE_PASSWORD }}
          MUSIKE_KEY_ALIAS: ${{ secrets.MUSIKE_KEY_ALIAS }}
          MUSIKE_KEY_PASSWORD: ${{ secrets.MUSIKE_KEY_PASSWORD }}
      - name: Check downloads
        run: |
          { echo "### Android"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/Medify-*-Android.apk 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file matching Medify-*-Android.apk, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: release/*
          if-no-files-found: error

  release:
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: Medify ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: downloads/*
          fail_on_unmatched_files: true
